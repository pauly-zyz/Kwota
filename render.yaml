# Render Blueprint — one-click backend for KWOTA (API + indexer + epoch worker in one service,
# Postgres, Redis). Deploy: https://render.com/deploy?repo=https://github.com/pauly-zyz/Kwota
# Secrets marked `sync: false` are asked for in the Render UI and never stored in git.
services:
  - type: web
    name: kwota-api
    runtime: docker
    plan: free            # upgrade to "starter" to avoid cold starts and keep the indexer running 24/7
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kwota-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kwota-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # model provider (OpenAI-compatible)
      - key: MODEL_PROVIDER
        value: openai_compatible
      - key: PROVIDER_ID
        value: surplus
      - key: PROVIDER_BASE_URL
        value: https://api.surplusintelligence.ai/v1
      - key: PROVIDER_API_KEY
        sync: false
      # web origins allowed for CORS + SIWE (replace with your exact domain when known)
      - key: CORS_ORIGINS
        value: https://kwota*.vercel.app,http://localhost:3000
      # chain: 46630 testnet / 4663 mainnet; empty RPC_URL uses the official public endpoint
      - key: CHAIN_ID
        value: "46630"
      - key: ADMIN_ADDRESSES
        sync: false
      - key: KWOTA_TOKEN_ADDRESS
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      - key: RUN_INDEXER
        value: "true"
      - key: RUN_WORKER
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: ALLOW_ADMIN_ADJUST
        value: "true"     # testnet only: lets the admin credit tester kwota (signed + audited). Set false on mainnet.
  - type: keyvalue
    name: kwota-redis
    plan: free
    ipAllowList: []       # internal connections only
    maxmemoryPolicy: noeviction

databases:
  - name: kwota-db
    plan: free            # free Postgres expires after 30 days on Render — move to a paid plan before launch
    databaseName: kwota
    user: kwota
